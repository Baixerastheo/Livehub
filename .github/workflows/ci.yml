name: CI/CD

on:
  push:
    branches:
      - develop
      - master

env:
  REGISTRY: registry.digitalocean.com/livehub

jobs:
  build-and-push:
    name: Build & Push images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DO Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_REGISTRY_TOKEN }}
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: Build & Push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/backend:${{ github.sha }}

      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_AUTH_URL=${{ secrets.NEXT_PUBLIC_AUTH_URL }}
            NEXT_PUBLIC_BACKEND_WS_URL=${{ secrets.NEXT_PUBLIC_BACKEND_WS_URL }}

  update-infra:
    name: Update infra repo
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout livehub-infra
        uses: actions/checkout@v4
        with:
          repository: Baixerastheo/livehub-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          ref: main

      - name: Update image tags
        run: |
          sed -i 's|tag:.*|tag: ${{ github.sha }}|g' helm/livehub/values.prod.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/livehub/values.prod.yaml
          git commit -m "chore: update image tags to ${{ github.sha }}"
          git push